name: Build Kernel Modules

on:
  push:
    branches: ['p2p/*']
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux kernel version to build against'
        default: '6.8.0-101-generic'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build kernel modules
        run: |
          docker build -f Dockerfile.build \
            --build-arg KERNEL_VERSION=${{ inputs.kernel_version || '6.8.0-101-generic' }} \
            --output type=local,dest=./out .

      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-ko-${{ github.ref_name }}
          path: out/*.ko
